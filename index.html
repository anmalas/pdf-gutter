<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제본 여백 넣기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
  :root {
    --paper: #f3f1ec;
    --sheet: #ffffff;
    --ink: #1f2933;
    --muted: #5b6672;
    --line: #cfd5db;
    --cloth: #24524a;
    --cloth-ink: #ffffff;
    --gutter: #d9a21b;
    --gutter-soft: rgba(227, 179, 65, .30);
    --block: #b9c2cb;
    --desk: #e4e1da;
    --error: #b42318;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #171b20;
      --sheet: #232930;
      --ink: #e6e9ec;
      --muted: #9aa5b1;
      --line: #3a434d;
      --cloth: #5fa596;
      --cloth-ink: #0f1a17;
      --gutter: #e3b341;
      --gutter-soft: rgba(227, 179, 65, .25);
      --block: #4b5662;
      --desk: #1f2429;
      --error: #f97066;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 24px 72px; }
  h1 {
    font-family: "Gowun Batang", "Batang", serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 2.75rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
  }
  .lead { color: var(--muted); margin: 0 0 32px; max-width: 34em; }

  /* 파일 */
  .drop {
    display: flex; align-items: center; gap: 16px; cursor: pointer;
    border: 1.5px dashed var(--line); border-radius: 8px;
    padding: 16px 20px; background: var(--sheet);
    transition: border-color .15s ease;
  }
  .drop.over, .drop:focus-within { border-color: var(--cloth); }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .drop .pick {
    flex: none; font-weight: 600; color: var(--cloth);
    border: 1px solid var(--cloth); border-radius: 6px; padding: 6px 14px;
  }
  .drop .hint { color: var(--muted); font-size: 15px; word-break: break-all; }
  .drop .hint.has { color: var(--ink); }

  /* 미리보기 */
  .preview {
    margin: 20px 0 32px;
    background: var(--desk);
    border-radius: 10px;
    padding: 24px 16px 16px;
  }
  .stage {
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 200px;
  }
  .sheet {
    position: relative; background: var(--sheet);
    box-shadow: 0 1px 3px rgba(0,0,0,.18);
    overflow: hidden; flex: none;
  }
  .sheet canvas { display: block; width: 100%; height: 100%; }
  .sheet.empty { visibility: hidden; }
  .stage.book .sheet.left { box-shadow: 0 1px 3px rgba(0,0,0,.18), inset -16px 0 18px -16px rgba(0,0,0,.35); }
  .stage.book .sheet.left::after,
  .stage.book .sheet.right::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 18px; pointer-events: none;
  }
  .stage.book .sheet.left::after { right: 0; background: linear-gradient(to left, rgba(0,0,0,.16), transparent); }
  .stage.book .sheet.right::after { left: 0; background: linear-gradient(to right, rgba(0,0,0,.16), transparent); }
  .stage.loose { gap: 16px; }
  .band {
    position: absolute; pointer-events: none;
    background: var(--gutter-soft); border: 0 dashed var(--gutter);
  }
  .bands-off .band { display: none; }
  .pnum { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* 예시 그림(파일 선택 전) */
  .demo .content {
    position: absolute; top: 9%; bottom: 9%; left: 12%; right: 12%;
    display: flex; flex-direction: column; gap: 7%; transform-origin: center;
    transition: transform .25s ease;
  }
  .demo .content span { display: block; height: 6%; background: var(--block); border-radius: 2px; }
  .demo .content span:nth-child(1) { width: 60%; height: 8%; }
  .demo .content span:nth-child(4) { width: 80%; }
  .demo .content span:nth-child(7) { width: 45%; }

  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px 16px; margin-top: 16px; font-size: 15px;
  }
  .toolbar[hidden] { display: none; }
  .nav { display: flex; align-items: center; gap: 8px; }
  .nav button {
    width: 36px; height: 36px; padding: 0; margin: 0;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--sheet); color: var(--ink); font-size: 18px; line-height: 1;
  }
  .nav button:disabled { opacity: .35; }
  .nav .count { min-width: 7.5em; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--sheet); }
  .seg label { cursor: pointer; padding: 6px 14px; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--cloth); color: var(--cloth-ink); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--gutter); outline-offset: -2px; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
  .check input { accent-color: var(--cloth); }
  .caption { text-align: center; font-size: 14px; color: var(--muted); margin: 12px 0 0; }

  /* 설정 */
  fieldset { border: none; padding: 0; margin: 0 0 28px; }
  legend, .label { font-weight: 600; margin-bottom: 10px; padding: 0; }
  .row { display: flex; align-items: center; gap: 16px; }
  input[type="range"] { flex: 1; accent-color: var(--cloth); }
  .num {
    display: flex; align-items: baseline; gap: 4px;
    font-family: "Gowun Batang", serif; font-size: 1.5rem; font-weight: 700;
  }
  .num input {
    width: 3.4em; font: inherit; color: var(--ink); background: var(--sheet);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; text-align: right;
  }
  .num input:disabled { opacity: .5; }
  .num small { font-family: "IBM Plex Sans KR", sans-serif; font-size: 14px; font-weight: 400; color: var(--muted); }
  .options { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .options label {
    display: block; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
    background: var(--sheet); font-size: 15px;
  }
  .options label small { display: block; color: var(--muted); font-size: 13px; }
  .options input { position: absolute; opacity: 0; pointer-events: none; }
  .options label:has(input:checked) { border-color: var(--cloth); box-shadow: inset 0 0 0 1px var(--cloth); }
  .options label:has(input:focus-visible) { outline: 2px solid var(--cloth); outline-offset: 2px; }
  .manual { margin-top: 12px; }
  .manual[hidden] { display: none; }

  .go {
    width: 100%; font: inherit; font-weight: 600; font-size: 17px;
    padding: 14px 20px; border: none; border-radius: 8px;
    background: var(--cloth); color: var(--cloth-ink); cursor: pointer;
  }
  button:disabled { cursor: not-allowed; }
  .go:disabled { opacity: .45; }
  button:focus-visible { outline: 2px solid var(--gutter); outline-offset: 3px; }
  .status { min-height: 1.6em; margin-top: 14px; font-size: 15px; }
  .status.error { color: var(--error); }
  .status a { color: var(--cloth); font-weight: 600; }
  .note { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .note p { margin: 0 0 8px; }
  @media (prefers-reduced-motion: reduce) { .demo .content { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>제본 여백 넣기</h1>
  <p class="lead">PDF 페이지 크기는 그대로 두고 내용을 옮겨서 제본 쪽 여백을 늘립니다. 반대쪽 여백이 그만큼 줄어들고, 잘리는 내용이 걱정되면 축소해서 맞출 수 있습니다.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="application/pdf,.pdf">
    <span class="pick">PDF 선택</span>
    <span class="hint" id="fileName">또는 여기로 끌어다 놓기</span>
  </label>

  <section class="preview" aria-label="미리보기">
    <div class="stage" id="stage"></div>
    <div class="toolbar" id="toolbar" hidden>
      <div class="nav">
        <button id="prev" aria-label="이전 페이지">‹</button>
        <span class="count" id="count"></span>
        <button id="next" aria-label="다음 페이지">›</button>
      </div>
      <div class="seg" role="radiogroup" aria-label="보기">
        <label><input type="radio" name="view" value="after" checked>적용 후</label>
        <label><input type="radio" name="view" value="before">원본</label>
      </div>
      <label class="check"><input type="checkbox" id="showBand" checked>여백 표시</label>
    </div>
    <p class="caption" id="caption"></p>
  </section>

  <fieldset>
    <div class="label" id="marginLabel">제본 여백</div>
    <div class="row">
      <input type="range" id="marginRange" min="0" max="30" step="0.5" value="10" aria-labelledby="marginLabel">
      <div class="num">
        <input type="number" id="marginNum" min="0" max="100" step="0.5" value="10" aria-label="제본 여백(mm)">
        <small>mm</small>
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>제본 위치</legend>
    <div class="options">
      <label><input type="radio" name="mode" value="duplex" checked>양면 · 왼쪽 제본<small>홀수 왼쪽, 짝수 오른쪽</small></label>
      <label><input type="radio" name="mode" value="duplex-rtl">양면 · 오른쪽 제본<small>홀수 오른쪽, 짝수 왼쪽</small></label>
      <label><input type="radio" name="mode" value="left">단면 · 왼쪽<small>모든 페이지 왼쪽</small></label>
      <label><input type="radio" name="mode" value="right">단면 · 오른쪽<small>모든 페이지 오른쪽</small></label>
      <label><input type="radio" name="mode" value="top">단면 · 위쪽<small>모든 페이지 위쪽</small></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>크기 조정</legend>
    <div class="options">
      <label><input type="radio" name="scale" value="none" checked>이동만<small>크기 그대로, 반대쪽 가장자리가 잘릴 수 있음</small></label>
      <label><input type="radio" name="scale" value="auto">자동 축소<small>여백만큼 줄여서 잘리지 않게</small></label>
      <label><input type="radio" name="scale" value="manual">직접 지정<small>배율을 정해서 줄이기</small></label>
    </div>
    <div class="row manual" id="manualRow" hidden>
      <input type="range" id="scaleRange" min="50" max="100" step="1" value="95" aria-label="배율">
      <div class="num">
        <input type="number" id="scaleNum" min="10" max="100" step="1" value="95" aria-label="배율(%)">
        <small>%</small>
      </div>
    </div>
  </fieldset>

  <button class="go" id="run" disabled>여백 넣고 내려받기</button>
  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="note">
    <p>파일은 서버로 올라가지 않고 이 브라우저 안에서만 처리됩니다.</p>
    <p>노란 영역은 새로 생긴 제본 여백입니다. 축소할 때는 내용이 제본 반대쪽과 위아래로도 고르게 줄어듭니다.</p>
  </div>
</main>

<script>
(() => {
  const MM_TO_PT = 72 / 25.4;
  const $ = (id) => document.getElementById(id);
  const pdfjsLib = window.pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

  const state = {
    file: null, srcBytes: null, outBytes: null,
    srcDoc: null, outDoc: null,
    spread: 0, view: "after", dirty: true, renderToken: 0,
  };

  // ---------- 설정 읽기 ----------
  const getMode = () => document.querySelector('input[name="mode"]:checked').value;
  const getScaleMode = () => document.querySelector('input[name="scale"]:checked').value;
  const getMargin = () => Math.max(0, parseFloat($("marginNum").value) || 0);
  const getManualPct = () => Math.min(100, Math.max(10, parseFloat($("scaleNum").value) || 100));
  const settings = () => ({ marginMm: getMargin(), mode: getMode(), scaleMode: getScaleMode(), manualPct: getManualPct() });

  // ---------- 변환 계산 ----------
  // 제본 쪽 방향(화면 기준). [x, y]: x=+1 → 내용을 오른쪽으로(왼쪽 제본)
  function bindDir(pageNo, mode) {
    switch (mode) {
      case "left": return [1, 0];
      case "right": return [-1, 0];
      case "top": return [0, -1];
      case "duplex-rtl": return pageNo % 2 ? [-1, 0] : [1, 0];
      default: return pageNo % 2 ? [1, 0] : [-1, 0];
    }
  }

  // 화면 방향 벡터를 PDF 좌표계 방향으로
  function toUserSpace(vx, vy, rotation) {
    switch (((rotation % 360) + 360) % 360) {
      case 90: return [-vy, vx];
      case 180: return [-vx, -vy];
      case 270: return [vy, -vx];
      default: return [vx, vy];
    }
  }

  // 배율 s 계산. W = 제본 방향의 페이지 길이(pt), m = 여백(pt)
  function scaleFor(scaleMode, W, m, manualPct) {
    if (scaleMode === "auto") return Math.max(0.05, (W - m) / W);
    if (scaleMode === "manual") return manualPct / 100;
    return 1;
  }

  // 페이지 하나의 변환 행렬 [s, 0, 0, s, e, f] (PDF 좌표계)
  // 가운데를 기준으로 s배 축소한 뒤, 내용의 제본 쪽 가장자리가 정확히 m만큼 안쪽에 오도록 이동
  function matrixFor(pageNo, box, rotation, opts) {
    const m = opts.marginMm * MM_TO_PT;
    const rot = ((rotation % 360) + 360) % 360;
    const visW = rot === 90 || rot === 270 ? box.height : box.width;
    const visH = rot === 90 || rot === 270 ? box.width : box.height;
    const [dx, dy] = bindDir(pageNo, opts.mode);
    const along = dx !== 0 ? visW : visH;
    const s = scaleFor(opts.scaleMode, along, m, opts.manualPct);
    const shift = m - along * (1 - s) / 2;
    const [ux, uy] = toUserSpace(dx * shift, dy * shift, rot);
    const cx = box.x + box.width / 2, cy = box.y + box.height / 2;
    return [s, 0, 0, s, cx * (1 - s) + ux, cy * (1 - s) + uy];
  }

  // ---------- PDF 처리 ----------
  async function addGutter(bytes, opts) {
    const { PDFDocument, PDFName, PDFArray, PDFDict, pushGraphicsState, popGraphicsState, concatTransformationMatrix } = PDFLib;
    const doc = await PDFDocument.load(bytes);

    doc.getPages().forEach((page, i) => {
      const box = page.getCropBox();
      const [a, b, c, d, e, f] = matrixFor(i + 1, box, page.getRotation().angle, opts);
      if (a === 1 && !e && !f) return;

      page.node.normalize();
      const start = doc.context.register(page.createContentStream(pushGraphicsState(), concatTransformationMatrix(a, b, c, d, e, f)));
      const end = doc.context.register(page.createContentStream(popGraphicsState()));
      page.node.wrapContentStreams(start, end);

      const annots = page.node.lookupMaybe(PDFName.of("Annots"), PDFArray);
      if (!annots) return;
      for (let j = 0; j < annots.size(); j++) {
        const an = annots.lookupMaybe(j, PDFDict);
        const rect = an && an.lookupMaybe(PDFName.of("Rect"), PDFArray);
        if (!rect) continue;
        const r = rect.asRectangle();
        an.set(PDFName.of("Rect"), doc.context.obj([
          a * r.x + e, d * r.y + f, a * (r.x + r.width) + e, d * (r.y + r.height) + f,
        ]));
      }
    });
    return doc.save();
  }

  // ---------- 펼침면 구성 ----------
  // 각 펼침면: [왼쪽 페이지 번호 | null, 오른쪽 페이지 번호 | null] 또는 단면은 [n]
  function buildSpreads(total, mode) {
    const out = [];
    if (mode === "duplex" || mode === "duplex-rtl") {
      const rtl = mode === "duplex-rtl";
      out.push(rtl ? [1, null] : [null, 1]);
      for (let n = 2; n <= total; n += 2) {
        const pair = [n, n + 1 <= total ? n + 1 : null];
        out.push(rtl ? [pair[1], pair[0]] : pair);
      }
    } else {
      for (let n = 1; n <= total; n++) out.push([n]);
    }
    return out;
  }

  // ---------- 예시 그림 (파일 없을 때) ----------
  function renderDemo() {
    const opts = settings();
    const stage = $("stage");
    const book = opts.mode.startsWith("duplex");
    stage.className = "stage demo " + (book ? "book" : "loose") + ($("showBand").checked ? "" : " bands-off");
    const pages = book ? (opts.mode === "duplex" ? [[2, "left"], [3, "right"]] : [[3, "left"], [2, "right"]]) : [[1, ""], [2, ""]];
    const w = Math.min(200, (stage.clientWidth - 24) / 2), h = w * 297 / 210;
    const box = { x: 0, y: 0, width: 595.28, height: 841.89 };
    stage.innerHTML = "";
    pages.forEach(([n, side]) => {
      const wrap = document.createElement("div");
      const sheet = document.createElement("div");
      sheet.className = "sheet " + side;
      sheet.style.width = w + "px"; sheet.style.height = h + "px";
      const content = document.createElement("div");
      content.className = "content";
      content.innerHTML = "<span></span>".repeat(7);
      const [s, , , , e, f] = matrixFor(n, box, 0, opts);
      // PDF 좌표(아래→위)를 화면 좌표로: 가운데 기준 배율 + 이동
      const tx = (e - box.width / 2 * (1 - s)) / box.width * w;
      const ty = -(f - box.height / 2 * (1 - s)) / box.height * h;
      content.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
      sheet.appendChild(content);
      sheet.appendChild(makeBand(n, opts, box.width, box.height));
      wrap.appendChild(sheet);
      const num = document.createElement("div");
      num.className = "pnum"; num.textContent = n;
      wrap.appendChild(num);
      stage.appendChild(wrap);
    });
    $("toolbar").hidden = true;
    $("caption").textContent = captionText(opts);
  }

  function makeBand(pageNo, opts, visW, visH) {
    const band = document.createElement("div");
    band.className = "band";
    const m = opts.marginMm * MM_TO_PT;
    const [dx, dy] = bindDir(pageNo, opts.mode);
    if (dy) {
      Object.assign(band.style, { left: 0, right: 0, top: 0, height: (m / visH * 100) + "%", borderBottomWidth: "1px" });
    } else {
      const pct = (m / visW * 100) + "%";
      Object.assign(band.style, dx > 0
        ? { top: 0, bottom: 0, left: 0, width: pct, borderRightWidth: "1px" }
        : { top: 0, bottom: 0, right: 0, width: pct, borderLeftWidth: "1px" });
    }
    return band;
  }

  function captionText(opts) {
    const where = {
      "duplex": "홀수 페이지는 왼쪽, 짝수 페이지는 오른쪽",
      "duplex-rtl": "홀수 페이지는 오른쪽, 짝수 페이지는 왼쪽",
      "left": "모든 페이지 왼쪽", "right": "모든 페이지 오른쪽", "top": "모든 페이지 위쪽",
    }[opts.mode];
    const scale = opts.scaleMode === "auto" ? ", 잘리지 않게 자동 축소"
      : opts.scaleMode === "manual" ? `, ${opts.manualPct}%로 축소` : "";
    return `${where}에 ${opts.marginMm}mm${scale}`;
  }

  // ---------- 실제 미리보기 ----------
  async function renderReal() {
    const token = ++state.renderToken;
    const opts = settings();
    const doc = state.view === "before" ? state.srcDoc : state.outDoc;
    if (!doc) return;
    const spreads = buildSpreads(doc.numPages, opts.mode);
    state.spread = Math.min(state.spread, spreads.length - 1);
    const spread = spreads[state.spread];
    const book = spread.length === 2;

    const stage = $("stage");
    const maxW = (stage.clientWidth - (book ? 0 : 0)) / (book ? 2 : 1);
    const maxH = Math.min(520, window.innerHeight * 0.6);

    // 페이지 정보를 먼저 모아 크기를 맞춤
    const pages = await Promise.all(spread.map(n => n ? doc.getPage(n) : null));
    if (token !== state.renderToken) return;
    const base = pages.find(Boolean).getViewport({ scale: 1 });
    const fit = Math.min(maxW / base.width, maxH / base.height);

    const frag = document.createDocumentFragment();
    const dpr = window.devicePixelRatio || 1;
    const jobs = [];
    spread.forEach((n, i) => {
      const wrap = document.createElement("div");
      const sheet = document.createElement("div");
      const side = book ? (i === 0 ? "left" : "right") : "";
      const vp1 = (pages[i] || pages.find(Boolean)).getViewport({ scale: 1 });
      const vp = (pages[i] || pages.find(Boolean)).getViewport({ scale: fit });
      sheet.className = "sheet " + side + (n ? "" : " empty");
      sheet.style.width = vp.width + "px"; sheet.style.height = vp.height + "px";
      if (n) {
        const canvas = document.createElement("canvas");
        canvas.width = Math.floor(vp.width * dpr); canvas.height = Math.floor(vp.height * dpr);
        sheet.appendChild(canvas);
        sheet.appendChild(makeBand(n, opts, vp1.width, vp1.height));
        jobs.push(pages[i].render({
          canvasContext: canvas.getContext("2d"),
          viewport: pages[i].getViewport({ scale: fit * dpr }),
        }).promise.catch(() => {}));
      }
      wrap.appendChild(sheet);
      const num = document.createElement("div");
      num.className = "pnum"; num.textContent = n || "";
      wrap.appendChild(num);
      frag.appendChild(wrap);
    });

    stage.className = "stage " + (book ? "book" : "loose") + ($("showBand").checked ? "" : " bands-off");
    stage.innerHTML = "";
    stage.appendChild(frag);
    await Promise.all(jobs);
    if (token !== state.renderToken) return;

    const shown = spread.filter(Boolean);
    $("count").textContent = (shown.length === 2 ? `${Math.min(...shown)}–${Math.max(...shown)}` : shown[0]) + ` / ${doc.numPages}쪽`;
    $("prev").disabled = state.spread === 0;
    $("next").disabled = state.spread >= spreads.length - 1;
    $("toolbar").hidden = false;
    $("caption").textContent = captionText(opts);
  }

  function render() { return state.file ? renderReal() : renderDemo(); }

  // ---------- 설정 변경 → 다시 만들기 ----------
  let timer = null;
  async function rebuild() {
    if (!state.srcBytes) { renderDemo(); return; }
    state.dirty = true;
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try {
        const out = await addGutter(state.srcBytes.slice(0), settings());
        state.outBytes = out;
        state.dirty = false;
        const old = state.outDoc;
        state.outDoc = await pdfjsLib.getDocument({ data: out.slice(0) }).promise;
        if (old) old.destroy();
        setStatus("");
        await renderReal();
      } catch (err) {
        showError(err);
      }
    }, 250);
  }

  // ---------- 이벤트 ----------
  const link = (rangeId, numId, max) => {
    $(rangeId).addEventListener("input", () => { $(numId).value = $(rangeId).value; onChange(); });
    $(numId).addEventListener("input", () => { $(rangeId).value = Math.min(parseFloat($(numId).value) || 0, max); onChange(); });
  };
  function onChange() {
    $("manualRow").hidden = getScaleMode() !== "manual";
    if (state.file) rebuild(); else renderDemo();
  }
  link("marginRange", "marginNum", 30);
  link("scaleRange", "scaleNum", 100);
  document.querySelectorAll('input[name="mode"], input[name="scale"]').forEach(r => r.addEventListener("change", () => {
    if (r.name === "mode") state.spread = 0;
    onChange();
  }));
  document.querySelectorAll('input[name="view"]').forEach(r => r.addEventListener("change", () => {
    state.view = r.value; renderReal();
  }));
  $("showBand").addEventListener("change", () => $("stage").classList.toggle("bands-off", !$("showBand").checked));
  $("prev").addEventListener("click", () => { state.spread--; renderReal(); });
  $("next").addEventListener("click", () => { state.spread++; renderReal(); });
  document.addEventListener("keydown", (e) => {
    if (!state.file || e.target.matches("input")) return;
    if (e.key === "ArrowLeft" && !$("prev").disabled) $("prev").click();
    if (e.key === "ArrowRight" && !$("next").disabled) $("next").click();
  });
  let resizeTimer;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });

  // 파일 선택
  const fileInput = $("file"), drop = $("drop");
  async function setFile(f) {
    if (!f) return;
    if (f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)) {
      setStatus("PDF 파일만 넣을 수 있습니다.", true);
      return;
    }
    setStatus("불러오는 중…");
    try {
      const bytes = new Uint8Array(await f.arrayBuffer());
      const srcDoc = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
      if (state.srcDoc) state.srcDoc.destroy();
      Object.assign(state, { file: f, srcBytes: bytes, srcDoc, spread: 0 });
      $("fileName").textContent = f.name;
      $("fileName").classList.add("has");
      $("run").disabled = false;
      await rebuild();
    } catch (err) {
      showError(err);
    }
  }
  fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
  ["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", ev => setFile(ev.dataTransfer.files[0]));

  function setStatus(html, isError = false) {
    $("status").innerHTML = html;
    $("status").classList.toggle("error", isError);
  }
  function showError(err) {
    console.error(err);
    const s = String(err && (err.name + err.message));
    setStatus(/encrypt|password/i.test(s)
      ? "암호가 걸린 PDF는 처리할 수 없습니다. 암호를 해제한 뒤 다시 넣어 주세요."
      : "PDF를 읽지 못했습니다. 파일이 손상되지 않았는지 확인해 주세요.", true);
  }

  // 내려받기
  $("run").addEventListener("click", async () => {
    if (!state.srcBytes) return;
    $("run").disabled = true;
    try {
      const out = state.dirty || !state.outBytes ? await addGutter(state.srcBytes.slice(0), settings()) : state.outBytes;
      const url = URL.createObjectURL(new Blob([out], { type: "application/pdf" }));
      const name = state.file.name.replace(/\.pdf$/i, "") + "_제본여백.pdf";
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setStatus(`완료했습니다. 내려받기가 시작되지 않으면 <a href="${url}" download="${name}">여기를 누르세요</a>.`);
    } catch (err) {
      showError(err);
    } finally {
      $("run").disabled = false;
    }
  });

  renderDemo();
})();
</script>
</body>
</html>
