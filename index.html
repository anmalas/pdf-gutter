<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제본 여백 넣기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  :root {
    --paper: #f3f1ec;
    --sheet: #ffffff;
    --ink: #1f2933;
    --muted: #5b6672;
    --line: #cfd5db;
    --cloth: #24524a;
    --cloth-ink: #ffffff;
    --gutter: #e3b341;
    --gutter-soft: rgba(227, 179, 65, .28);
    --block: #b9c2cb;
    --error: #b42318;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #171b20;
      --sheet: #232930;
      --ink: #e6e9ec;
      --muted: #9aa5b1;
      --line: #3a434d;
      --cloth: #5fa596;
      --cloth-ink: #0f1a17;
      --gutter: #e3b341;
      --gutter-soft: rgba(227, 179, 65, .22);
      --block: #4b5662;
      --error: #f97066;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 56px 24px 72px;
  }
  h1 {
    font-family: "Gowun Batang", "Batang", serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 2.75rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
  }
  .lead { color: var(--muted); margin: 0 0 36px; max-width: 34em; }

  /* 펼친 책 미리보기 */
  .spread {
    display: flex;
    justify-content: center;
    gap: 0;
    padding: 28px 12px 20px;
    margin-bottom: 8px;
  }
  .page {
    position: relative;
    width: min(42%, 220px);
    aspect-ratio: 1 / 1.414;
    background: var(--sheet);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .page.left { border-right: none; box-shadow: inset -14px 0 18px -16px rgba(0,0,0,.35); }
  .page.right { box-shadow: inset 14px 0 18px -16px rgba(0,0,0,.35); }
  .page.single { border-right: 1px solid var(--line); box-shadow: none; }
  .band {
    position: absolute;
    background: var(--gutter-soft);
    border: 0 dashed var(--gutter);
    transition: all .25s ease;
  }
  .content {
    position: absolute;
    top: 9%; bottom: 9%; left: 12%; right: 12%;
    display: flex; flex-direction: column; gap: 7%;
    transition: transform .25s ease;
  }
  .content span { display: block; height: 6%; background: var(--block); border-radius: 2px; }
  .content span:nth-child(1) { width: 60%; height: 8%; }
  .content span:nth-child(4) { width: 80%; }
  .content span:nth-child(7) { width: 45%; }
  .pnum {
    position: absolute; bottom: 3%; left: 0; right: 0;
    text-align: center; font-size: 11px; color: var(--muted);
    transition: transform .25s ease;
  }
  .caption { text-align: center; font-size: 14px; color: var(--muted); margin: 0 0 36px; }

  /* 설정 */
  fieldset { border: none; padding: 0; margin: 0 0 28px; }
  legend, .label { font-weight: 600; margin-bottom: 10px; padding: 0; }
  .margin-row { display: flex; align-items: center; gap: 16px; }
  input[type="range"] { flex: 1; accent-color: var(--cloth); }
  .num {
    display: flex; align-items: baseline; gap: 4px;
    font-family: "Gowun Batang", serif; font-size: 1.5rem; font-weight: 700;
  }
  .num input {
    width: 3.2em; font: inherit; color: var(--ink); background: var(--sheet);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; text-align: right;
  }
  .num small { font-family: "IBM Plex Sans KR", sans-serif; font-size: 14px; font-weight: 400; color: var(--muted); }
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .modes label {
    display: block; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
    background: var(--sheet); font-size: 15px;
  }
  .modes label small { display: block; color: var(--muted); font-size: 13px; }
  .modes input { position: absolute; opacity: 0; pointer-events: none; }
  .modes label:has(input:checked) { border-color: var(--cloth); box-shadow: inset 0 0 0 1px var(--cloth); }
  .modes label:has(input:focus-visible) { outline: 2px solid var(--cloth); outline-offset: 2px; }

  /* 파일 */
  .drop {
    display: block; cursor: pointer;
    border: 1.5px dashed var(--line); border-radius: 8px;
    padding: 28px 20px; text-align: center; background: var(--sheet);
    transition: border-color .15s ease;
  }
  .drop.over, .drop:focus-within { border-color: var(--cloth); }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .drop strong { display: block; font-weight: 600; }
  .drop span { color: var(--muted); font-size: 14px; }
  .file-name { margin-top: 6px; color: var(--ink); font-size: 15px; word-break: break-all; }

  button {
    margin-top: 20px; width: 100%;
    font: inherit; font-weight: 600; font-size: 17px;
    padding: 14px 20px; border: none; border-radius: 8px;
    background: var(--cloth); color: var(--cloth-ink); cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--gutter); outline-offset: 3px; }
  .status { min-height: 1.6em; margin-top: 14px; font-size: 15px; }
  .status.error { color: var(--error); }
  .status a { color: var(--cloth); font-weight: 600; }
  .note { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .note p { margin: 0 0 8px; }
  @media (prefers-reduced-motion: reduce) {
    .band, .content, .pnum { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>제본 여백 넣기</h1>
  <p class="lead">PDF 페이지 크기는 그대로 두고 내용을 옮겨서, 제본 쪽 여백을 늘린 만큼 반대쪽 여백을 줄입니다.</p>

  <div class="spread" id="spread" aria-hidden="true"></div>
  <p class="caption" id="caption"></p>

  <fieldset>
    <div class="label" id="marginLabel">제본 여백</div>
    <div class="margin-row">
      <input type="range" id="marginRange" min="0" max="30" step="0.5" value="10" aria-labelledby="marginLabel">
      <div class="num">
        <input type="number" id="marginNum" min="0" max="100" step="0.5" value="10" aria-label="제본 여백(mm)">
        <small>mm</small>
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>제본 위치</legend>
    <div class="modes">
      <label><input type="radio" name="mode" value="duplex" checked>양면 · 왼쪽 제본<small>홀수 왼쪽, 짝수 오른쪽</small></label>
      <label><input type="radio" name="mode" value="duplex-rtl">양면 · 오른쪽 제본<small>홀수 오른쪽, 짝수 왼쪽</small></label>
      <label><input type="radio" name="mode" value="left">단면 · 왼쪽<small>모든 페이지 왼쪽</small></label>
      <label><input type="radio" name="mode" value="right">단면 · 오른쪽<small>모든 페이지 오른쪽</small></label>
      <label><input type="radio" name="mode" value="top">단면 · 위쪽<small>모든 페이지 위쪽</small></label>
    </div>
  </fieldset>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="application/pdf,.pdf">
    <strong>PDF 파일 선택</strong>
    <span>또는 여기로 끌어다 놓기</span>
    <div class="file-name" id="fileName"></div>
  </label>

  <button id="run" disabled>여백 넣고 내려받기</button>
  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="note">
    <p>파일은 서버로 올라가지 않고 이 브라우저 안에서만 처리됩니다.</p>
    <p>원본의 반대쪽 여백이 넣으려는 여백보다 좁으면 그쪽 가장자리 내용이 잘립니다.</p>
  </div>
</main>

<script>
(() => {
  const MM_TO_PT = 72 / 25.4;
  const $ = (id) => document.getElementById(id);
  const range = $("marginRange"), num = $("marginNum");
  const fileInput = $("file"), drop = $("drop"), runBtn = $("run"), statusEl = $("status");
  let currentFile = null;

  const getMode = () => document.querySelector('input[name="mode"]:checked').value;
  const getMargin = () => Math.max(0, parseFloat(num.value) || 0);

  // 화면 기준 이동량(dx 오른쪽+, dy 위쪽+). pageNo는 1부터.
  function visualOffset(pageNo, m, mode) {
    switch (mode) {
      case "left": return [m, 0];
      case "right": return [-m, 0];
      case "top": return [0, -m];
      case "duplex-rtl": return pageNo % 2 ? [-m, 0] : [m, 0];
      default: return pageNo % 2 ? [m, 0] : [-m, 0];
    }
  }

  // /Rotate 가 있는 페이지는 화면 방향을 PDF 좌표계 방향으로 바꿔 줌
  function toUserSpace(vx, vy, rotation) {
    switch (((rotation % 360) + 360) % 360) {
      case 90: return [-vy, vx];
      case 180: return [-vx, -vy];
      case 270: return [vy, -vx];
      default: return [vx, vy];
    }
  }

  // ---- 미리보기 ----
  function pageHTML(cls, label) {
    return `<div class="page ${cls}"><div class="band"></div><div class="content">${"<span></span>".repeat(7)}</div><div class="pnum">${label}</div></div>`;
  }
  function renderPreview() {
    const mode = getMode(), m = getMargin();
    const spread = $("spread");
    const duplex = mode.startsWith("duplex");
    // 양면은 펼친 면(왼쪽 페이지 = 짝수, 오른쪽 페이지 = 홀수, RTL은 반대)
    const pages = duplex
      ? (mode === "duplex" ? [[2, "left"], [3, "right"]] : [[3, "left"], [2, "right"]])
      : [[1, "single"], [2, "single"]];
    spread.style.gap = duplex ? "0" : "16px";
    spread.innerHTML = pages.map(([n, cls]) => pageHTML(cls, n)).join("");

    // A4 폭 210mm 기준 비율로 표시
    const pct = Math.min(m / 210 * 100, 40);
    [...spread.children].forEach((el, i) => {
      const n = pages[i][0];
      const [dx, dy] = visualOffset(n, pct, mode);
      const band = el.querySelector(".band");
      const content = el.querySelector(".content");
      const pnum = el.querySelector(".pnum");
      const hPct = mode === "top" ? m / 297 * 100 : 0;
      content.style.transform = mode === "top" ? `translateY(${hPct / 82 * 100}%)` : `translateX(${dx / 76 * 100}%)`;
      pnum.style.transform = mode === "top" ? "" : `translateX(${dx}%)`;
      Object.assign(band.style, { top: "0", bottom: "0", left: "auto", right: "auto", width: "auto", height: "auto", borderWidth: "0" });
      if (mode === "top") {
        Object.assign(band.style, { left: "0", right: "0", height: hPct + "%", bottom: "auto", borderBottomWidth: "1px" });
      } else if (dx > 0) {
        Object.assign(band.style, { left: "0", width: pct + "%", borderRightWidth: "1px" });
      } else if (dx < 0) {
        Object.assign(band.style, { right: "0", width: pct + "%", borderLeftWidth: "1px" });
      }
    });

    const where = {
      "duplex": "홀수 페이지는 왼쪽, 짝수 페이지는 오른쪽",
      "duplex-rtl": "홀수 페이지는 오른쪽, 짝수 페이지는 왼쪽",
      "left": "모든 페이지 왼쪽", "right": "모든 페이지 오른쪽", "top": "모든 페이지 위쪽"
    }[mode];
    $("caption").textContent = `${where}에 ${m}mm를 더합니다.`;
  }

  range.addEventListener("input", () => { num.value = range.value; renderPreview(); });
  num.addEventListener("input", () => { range.value = Math.min(getMargin(), 30); renderPreview(); });
  document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener("change", renderPreview));

  // ---- 파일 선택 ----
  function setFile(f) {
    if (!f) return;
    if (f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)) {
      setStatus("PDF 파일만 넣을 수 있습니다.", true);
      return;
    }
    currentFile = f;
    $("fileName").textContent = f.name;
    runBtn.disabled = false;
    setStatus("");
  }
  fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
  ["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", ev => setFile(ev.dataTransfer.files[0]));

  function setStatus(html, isError = false) {
    statusEl.innerHTML = html;
    statusEl.classList.toggle("error", isError);
  }

  // ---- 처리 ----
  async function addGutter(bytes, marginMm, mode) {
    const { PDFDocument, PDFName, PDFArray, PDFDict } = PDFLib;
    const doc = await PDFDocument.load(bytes);
    const m = marginMm * MM_TO_PT;

    doc.getPages().forEach((page, i) => {
      const [vx, vy] = visualOffset(i + 1, m, mode);
      const [ux, uy] = toUserSpace(vx, vy, page.getRotation().angle);
      if (!ux && !uy) return;

      // 내용만 이동, 페이지 크기는 유지
      page.translateContent(ux, uy);

      // 링크·주석 위치도 함께 이동
      const annots = page.node.lookupMaybe(PDFName.of("Annots"), PDFArray);
      if (!annots) return;
      for (let j = 0; j < annots.size(); j++) {
        const a = annots.lookupMaybe(j, PDFDict);
        const rect = a && a.lookupMaybe(PDFName.of("Rect"), PDFArray);
        if (!rect) continue;
        const { x, y, width, height } = rect.asRectangle();
        a.set(PDFName.of("Rect"), doc.context.obj([x + ux, y + uy, x + width + ux, y + height + uy]));
      }
    });
    return doc.save();
  }

  runBtn.addEventListener("click", async () => {
    if (!currentFile) return;
    runBtn.disabled = true;
    setStatus("처리 중…");
    try {
      const out = await addGutter(await currentFile.arrayBuffer(), getMargin(), getMode());
      const url = URL.createObjectURL(new Blob([out], { type: "application/pdf" }));
      const name = currentFile.name.replace(/\.pdf$/i, "") + "_제본여백.pdf";
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setStatus(`완료했습니다. 내려받기가 시작되지 않으면 <a href="${url}" download="${name}">여기를 누르세요</a>.`);
    } catch (err) {
      console.error(err);
      const msg = /encrypt/i.test(String(err))
        ? "암호가 걸린 PDF는 처리할 수 없습니다. 암호를 해제한 뒤 다시 넣어 주세요."
        : "PDF를 읽지 못했습니다. 파일이 손상되지 않았는지 확인해 주세요.";
      setStatus(msg, true);
    } finally {
      runBtn.disabled = false;
    }
  });

  renderPreview();
})();
</script>
</body>
</html>
